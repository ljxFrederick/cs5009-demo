name: base-known-pool-realized-arb
on:
  push:
    branches: [main]
    paths: ["known-pool-arb-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3 -q
      - run: python base_known_pool_realized_arb.py
