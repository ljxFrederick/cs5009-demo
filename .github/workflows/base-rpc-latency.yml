name: base-rpc-latency
on:
  push:
    branches: [main]
    paths: ["base-rpc-latency-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python base_rpc_latency.py
