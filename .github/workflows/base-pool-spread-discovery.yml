name: base-pool-spread-discovery
on:
  push:
    branches: [main]
    paths: ["base-pool-spread-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python base_pool_spread_discovery.py
