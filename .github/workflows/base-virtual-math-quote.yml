name: base-virtual-math-quote
on:
  push:
    branches: [main]
    paths: ["base-virtual-math-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3 -q
      - run: python base_virtual_math_quote.py
