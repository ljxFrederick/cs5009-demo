name: relation-queue-probe
on:
  push:
    branches: [main]
    paths: ["relation-queue-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python relation_queue_probe.py
