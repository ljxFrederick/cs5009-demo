name: base-v3-spot-monitor
on:
  push:
    branches: [main]
    paths: ["base-v3-spot-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3 -q
      - run: python base_v3_spot_monitor.py
