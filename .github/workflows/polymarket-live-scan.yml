name: polymarket-live-scan

on:
  push:
    branches: [main]
    paths:
      - "polymarket-live-scan-trigger.txt"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check websockets==15.0.1 pycryptodome
      - name: Run global RTDS NegRisk fill-conversion watcher
        run: python global_negrisk_rtds_watch.py
