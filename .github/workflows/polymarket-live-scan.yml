name: polymarket-live-scan

on:
  push:
    branches: [main]
    paths:
      - "polymarket-live-scan-trigger.txt"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WebSocket dependency
        run: pip install websocket-client
      - name: Run realtime WebSocket arb observer
        run: python polymarket_ws_observer.py
