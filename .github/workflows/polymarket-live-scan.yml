name: polymarket-live-scan

on:
  push:
    branches: [main]
    paths:
      - "polymarket-live-scan-trigger.txt"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WebSocket dependency
        run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Run frame-atomic maker/taker hedge watcher
        run: python polymarket_ws_hybrid_watch.py
      - name: Run broad snapshot scanner
        run: python polymarket_broad_scan.py
