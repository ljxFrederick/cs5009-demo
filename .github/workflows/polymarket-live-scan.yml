name: polymarket-live-scan

on:
  push:
    branches: [main]
    paths:
      - "polymarket-live-scan-trigger.txt"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install keccak dependency
        run: python -m pip install --disable-pip-version-check pycryptodome
      - name: Probe on-chain NegRisk conversion fee
        run: python negrisk_fee_probe.py
