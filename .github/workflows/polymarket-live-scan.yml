name: polymarket-live-scan

on:
  push:
    branches: [main]
    paths:
      - "polymarket-live-scan-trigger.txt"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact resolution rules for top relation
        run: python polymarket_rules_probe.py
