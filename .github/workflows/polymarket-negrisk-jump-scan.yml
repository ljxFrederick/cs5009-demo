name: polymarket-negrisk-jump-scan
on:
  push:
    branches: [main]
    paths: ["negrisk-jump-trigger.txt"]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python negrisk_jump_queue_scan.py
