name: base-weth-historical-arb-frequency
on:
  push:
    branches: [main]
    paths: ["base-weth-hist-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3 -q
      - run: python base_weth_historical_arb.py
