name: base-bot-tx-forensics
on:
  push:
    branches: [main]
    paths: ["base-bot-forensics-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3 -q
      - run: python base_bot_tx_forensics.py
