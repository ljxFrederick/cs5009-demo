name: base-cross-dex-atomic-arb
on:
  push:
    branches: [main]
    paths: ["base-cross-dex-trigger.txt"]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install web3
      - run: python base_cross_dex_atomic_arb.py
