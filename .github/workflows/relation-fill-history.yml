name: relation-fill-history
on:
  push:
    branches: [main]
    paths: ["relation-fill-history-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python relation_fill_history.py
