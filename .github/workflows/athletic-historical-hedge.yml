name: athletic-historical-hedge
on:
  push:
    branches: [main]
    paths: ["athletic-historical-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python athletic_historical_hedge.py
