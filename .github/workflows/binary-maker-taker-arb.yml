name: binary-maker-taker-arb
on:
  push:
    branches: [main]
    paths: ["binary-maker-taker-trigger.txt"]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python binary_maker_taker_arb.py
